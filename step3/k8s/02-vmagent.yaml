---
# vmagent: octocat-api Service를 스크레이프 → vmsingle로 remote_write
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: vm
data:
  scrape.yml: |
    global:
      scrape_interval: 10s
      external_labels:
        env: poc-aks
        source: octocat-supply
    scrape_configs:
      - job_name: octocat-api
        metrics_path: /metrics
        static_configs:
          - targets: ['octocat-api.vm.svc.cluster.local:3000']
            labels:
              app: octocat-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: vm
  labels: { app: vmagent }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vmagent }
  template:
    metadata:
      labels: { app: vmagent }
    spec:
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.150.0
          args:
            - -promscrape.config=/config/scrape.yml
            - -remoteWrite.url=http://vmsingle-victoria-metrics-single-server.vm.svc.cluster.local:8428/api/v1/write
          ports:
            - containerPort: 8429
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
      volumes:
        - name: config
          configMap:
            name: vmagent-config
